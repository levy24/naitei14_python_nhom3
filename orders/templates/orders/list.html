{% extends 'base.html' %}
{% block content %}
<h1>Danh sách đơn hàng</h1>
{% for order in orders %}
  <div>
    <a href="{% url 'orders:detail' order.id %}">Đơn hàng #{{ order.id }}</a>
    - Tổng: {{ order.total_price }} VNĐ
    - Trạng thái: {{ order.status }}
  </div>
{% endfor %}
{% endblock %}
